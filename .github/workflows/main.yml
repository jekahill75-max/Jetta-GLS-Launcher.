
name: Build Jetta GLS Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto Android
        run: |
          mkdir -p proyecto
          unzip -o Jetta_GLS_Launcher_Proyecto_Movil.zip -d proyecto
          cp -r proyecto/app .
          cp proyecto/build.gradle .
          cp proyecto/settings.gradle .
          cp proyecto/gradle.properties .

      - name: Corregir Java y Kotlin
        run: |
          sed -i "/android {/a\\    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17\\n    }\\n    kotlinOptions {\\n        jvmTarget = '17'\\n    }" app/build.gradle

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jetta-GLS-Launcher
          path: app/build/outputs/apk/debug/*.apk
